name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens a release PR (version bump + CHANGELOG) from conventional commits.
      # Merging it creates the GitHub release, which triggers publish.yml.
      # Note: releases created with GITHUB_TOKEN don't trigger other workflows;
      # set a RELEASE_PLEASE_TOKEN (fine-grained PAT) secret so publish.yml runs.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
